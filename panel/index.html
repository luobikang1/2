<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TUIC 节点面板 — 可视化生成与订阅</title>
  <meta name="description" content="TUIC 节点可视化面板 — 生成 TUIC 节点链接、二维码与 Base64 订阅链接，部署于 Cloudflare Pages" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%A1%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="aurora"></div>

  <header class="hero">
    <h1>TUIC Panel</h1>
    <p class="tagline">TUIC 节点可视化生成 · 二维码 · 订阅链接</p>
    <p class="hint">输入节点信息，一键生成 <strong>tuic://</strong> 链接、二维码与 Base64 订阅</p>
  </header>

  <main class="container">
    <!-- Node Form -->
    <section class="card form-card">
      <h2>节点配置</h2>
      <div class="grid">
        <label class="field">
          <span>服务器地址 <em>*</em></span>
          <input id="server" type="text" placeholder="example.com 或 IP" autocomplete="off" />
          <small>TUIC 服务器域名或 IP 地址</small>
        </label>
        <label class="field">
          <span>端口 <em>*</em></span>
          <input id="port" type="text" value="443" autocomplete="off" />
          <small>TUIC UDP 端口，默认 443</small>
        </label>
        <label class="field">
          <span>UUID <em>*</em></span>
          <span class="with-btn">
            <input id="uuid" type="text" placeholder="点击右侧按钮生成" autocomplete="off" />
            <button type="button" id="genUuid" class="mini" title="随机生成 UUID">🎲</button>
          </span>
          <small>客户端认证 UUID</small>
        </label>
        <label class="field">
          <span>密码</span>
          <input id="password" type="text" placeholder="留空 = 使用 UUID" autocomplete="off" />
          <small>TUIC 密码，留空则使用 UUID</small>
        </label>
        <label class="field">
          <span>SNI</span>
          <input id="sni" type="text" placeholder="留空 = 使用服务器地址" autocomplete="off" />
          <small>TLS Server Name Indication</small>
        </label>
        <label class="field">
          <span>节点名称</span>
          <input id="nodeName" type="text" value="TUIC-Node" autocomplete="off" />
          <small>显示在客户端的名称</small>
        </label>
      </div>

      <details class="advanced">
        <summary>高级选项（拥塞控制 / ALPN / 安全设置）</summary>
        <div class="grid">
          <label class="field">
            <span>拥塞控制</span>
            <select id="congestion">
              <option value="bbr" selected>BBR</option>
              <option value="cubic">Cubic</option>
              <option value="new_reno">New Reno</option>
            </select>
          </label>
          <label class="field">
            <span>ALPN</span>
            <select id="alpn">
              <option value="h3" selected>h3</option>
              <option value="h3,spdy/3.1">h3, spdy/3.1</option>
              <option value="h2">h2</option>
            </select>
          </label>
          <label class="field">
            <span>UDP Relay Mode</span>
            <select id="udpRelay">
              <option value="native" selected>native</option>
              <option value="quic">quic</option>
            </select>
          </label>
          <label class="field">
            <span>允许不安全证书</span>
            <select id="allowInsecure">
              <option value="0">否</option>
              <option value="1" selected>是</option>
            </select>
          </label>
        </div>
      </details>

      <div class="actions">
        <button type="button" id="addNode" class="primary">➕ 添加节点</button>
        <button type="button" id="clearAll" class="ghost">🗑️ 清空所有</button>
      </div>
    </section>

    <!-- Subscription Section -->
    <section class="card sub-card" id="subSection" hidden>
      <h2>📡 订阅链接</h2>
      <div class="sub-box">
        <label class="field">
          <span>Base64 订阅内容（可直接导入客户端）</span>
          <div class="with-btn">
            <textarea id="subContent" rows="3" readonly></textarea>
            <button type="button" id="copySub" class="mini" title="复制订阅">📋</button>
          </div>
        </label>
      </div>
      <div class="sub-actions">
        <button type="button" id="copySubBtn" class="primary">📋 复制订阅链接</button>
        <button type="button" id="copyAllLinks" class="ghost">📝 复制全部节点链接</button>
      </div>
    </section>

    <!-- Nodes Output -->
    <section id="nodesOutput" class="nodes-grid" aria-live="polite"></section>
  </main>

  <footer class="footer">
    <p>TUIC Panel · 纯前端生成，数据不离开浏览器 · 部署于 Cloudflare Pages</p>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/qrcode.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
