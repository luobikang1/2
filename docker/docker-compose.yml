# ============================================================================
#  🦊 北极狐 (Arctic Fox) v2 — docker compose
#  用法:
#    1. cp .env.example .env  并填写 TUNNEL_TOKEN / UUID
#    2. docker compose up -d --build
#    3. docker compose logs -f   查看自动生成的节点链接
# ============================================================================
services:
  beijihu:
    build:
      context: .
      dockerfile: Dockerfile
    image: beijihu-tuic:latest
    container_name: beijihu
    restart: unless-stopped
    env_file:
      - .env
    # TUIC + Hysteria2 为 UDP 直连，需要映射端口（WS/Argo 走 cloudflared，无需映射）
    ports:
      - "${TUIC_PORT:-443}:${TUIC_PORT:-443}/udp"
      - "${HYSTERIA2_PORT:-8443}:${HYSTERIA2_PORT:-8443}/udp"
    # 持久化证书，避免重启后客户端需要更新指纹
    volumes:
      - beijihu-certs:/etc/beijihu
    networks:
      - beijihu-net

volumes:
  beijihu-certs:

networks:
  beijihu-net:
    driver: bridge
